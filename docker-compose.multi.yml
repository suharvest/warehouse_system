# 多实例部署：一个镜像，多个独立仓库
# 使用方式: docker-compose -f docker-compose.multi.yml up -d
#
# 默认 3 个实例（一个容器 = 一个完整仓库）:
#   - 仓库A: http://localhost:1025
#   - 仓库B: http://localhost:1026
#   - 仓库C: http://localhost:1027
#
# 需要更多实例？复制一个 service 块，改端口和 volume 名。

x-warehouse: &warehouse-base
  build: .
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '1'
        memory: ${WAREHOUSE_MEMORY_LIMIT:-2G}  # 为本地 WE2 推理和突发任务预留余量；可按设备资源覆盖

services:
  warehouse-a:
    <<: *warehouse-base
    container_name: warehouse-a
    ports:
      - "1025:1025"
    volumes:
      - data_a:/data
      # 客户通过智控台上传的 ERP Provider（.py）落在这里。必须是卷 ——
      # 镜像不含它（.dockerignore 排除 mcp/providers/custom/**），不挂卷
      # 就只能活在容器可写层，换镜像即丢失，系统会静默回退到
      # DefaultProvider（本地演示数据），查询看着能跑但全是假数据。
      - providers_a:/app/mcp/providers/custom
    environment:
      PORT: 1025
      DEPLOY_MODE: ${DEPLOY_MODE:-single_tenant}
      FACTORY_API_KEY: ${FACTORY_API_KEY:-}

  warehouse-b:
    <<: *warehouse-base
    container_name: warehouse-b
    ports:
      - "1026:1026"
    volumes:
      - data_b:/data
      - providers_b:/app/mcp/providers/custom
    environment:
      PORT: 1026
      DEPLOY_MODE: ${DEPLOY_MODE:-single_tenant}
      FACTORY_API_KEY: ${FACTORY_API_KEY:-}

  warehouse-c:
    <<: *warehouse-base
    container_name: warehouse-c
    ports:
      - "1027:1027"
    volumes:
      - data_c:/data
      - providers_c:/app/mcp/providers/custom
    environment:
      PORT: 1027
      DEPLOY_MODE: ${DEPLOY_MODE:-single_tenant}
      FACTORY_API_KEY: ${FACTORY_API_KEY:-}

volumes:
  data_a:
  data_b:
  data_c:
  providers_a:
  providers_b:
  providers_c:
