# 服务器生产环境 Docker Compose 配置
# 使用预构建镜像，all-in-one 单容器
# 使用方式: docker-compose -f deploy/docker-compose.server.yml up -d

services:
  warehouse:
    image: sensecraft-missionpack.seeed.cn/solution/warehouse:latest
    container_name: smart-wms
    ports:
      - "1025:1025"
    volumes:
      - ../data:/data
      # 客户通过智控台上传的 ERP Provider（.py）落在这里。必须是卷 ——
      # 镜像不含它（.dockerignore 排除 mcp/providers/custom/**），不挂卷
      # 就只能活在容器可写层，换镜像即丢失，系统会静默回退到
      # DefaultProvider（本地演示数据），查询看着能跑但全是假数据。
      - ../providers_custom:/app/mcp/providers/custom
    environment:
      - PORT=1025
      - DATABASE_PATH=/data/warehouse.db
      - DEPLOY_MODE=${DEPLOY_MODE:-single_tenant}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-10}
      - MAX_IMPORT_ROWS=${MAX_IMPORT_ROWS:-10000}
      # 云端/线上版默认不开放人脸识别；私有部署需要时显式设 FACE_ENABLED=true。
      - FACE_ENABLED=${FACE_ENABLED:-false}
      - FACE_WE2_SIMULATOR_ENABLED=${FACE_WE2_SIMULATOR_ENABLED:-0}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G                    # 1G：为 mode=local WE2 本地人脸推理留足内存（ai-edge-litert + tflite 模型进程内懒加载）；不用本地推理也无害
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1025/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
