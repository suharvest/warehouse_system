root_cause_fixed: >
  106c2db: generate_batch_no changed from "SELECT max seq committed -> +1"
  (racy under concurrent uncommitted transactions) to an atomic UPDATE on a
  new batch_no_sequences(warehouse_id, day_key, last_seq) table, serialized
  by the database. Verified no regression in batch_no format (YYYYMMDD-NNN)
  and no duplicate batch numbers across 1481 concurrently-created batches.
second_cause_hypothesis_from_09_05_results_md: >
  results.md 09-05 提到过一个"第二成因假设：多 worker 进程各自取号"。
  已核实：容器启动命令是 `.venv/bin/python run_backend.py`，单进程
  uvicorn（未见 gunicorn/多 worker 配置，`grep -n "workers"
  backend/*.py run_backend.py` 无命中），本次复测环境是单进程，这个
  假设在当前部署形态下不适用；若未来改用多进程/多副本部署，
  batch_no_sequences 的原子 UPDATE 仍能保证跨进程/跨副本正确
  （单一 DB 表做串行点），但尚未在多副本环境下实测，标记为**需核实**。
